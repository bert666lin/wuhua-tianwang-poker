# tianwang.geju8.cn - 五华天王扑克H5
server {
    listen 80;
    server_name tianwang.geju8.cn;
    # HTTP重定向到HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name tianwang.geju8.cn;

    ssl_certificate /etc/letsencrypt/live/tianwang.geju8.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tianwang.geju8.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 基础安全响应头。带 add_header 的 location 会覆盖 server 级继承，那些位置要重复一份。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;

    # 压缩：nginx.conf 里 gzip_types 被注释掉了，默认只压 text/html，
    # JS/CSS 一点没压。首屏 index js 有 400KB+，必须在这里补上。
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               image/svg+xml font/woff font/woff2;

    # 目录跳转（/download → /download/）用相对 Location，
    # 否则 nginx 可能拼出 http:// 的绝对地址，把用户从 HTTPS 踢回 HTTP。
    absolute_redirect off;

    # ── 安装包下载区（/srv/wuhua-tianwang/downloads/）──
    # 单独放在 frontend/ 之外：每次发布 frontend 目录会被整体替换，
    # APK 放里面会被发布冲掉。这里用 alias 指向持久目录，
    # 由 scripts/publish-apk.sh 单独上传，发布前端时互不影响。
    location = /download/wuhuatianwang.apk {
        alias /srv/wuhua-tianwang/downloads/wuhuatianwang.apk;
        # 必须是这个 MIME，否则部分安卓浏览器会把 apk 当文本打开而不是下载
        types { } default_type application/vnd.android.package-archive;
        # 基础安全响应头。带 add_header 的 location 会覆盖 server 级继承，那些位置要重复一份。
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        add_header Content-Disposition 'attachment; filename="wuhuatianwang.apk"';
        add_header Cache-Control "public, max-age=300";
        access_log off;
    }
    location = /download/apk-info.json {
        alias /srv/wuhua-tianwang/downloads/apk-info.json;
        types { } default_type application/json;
        # 基础安全响应头。带 add_header 的 location 会覆盖 server 级继承，那些位置要重复一份。
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        add_header Cache-Control "no-cache";
        access_log off;
    }

    # 带 hash 的产物内容不可变，可长缓存
    location /assets/ {
        root /srv/wuhua-tianwang/frontend;
        access_log off;
        # 基础安全响应头。带 add_header 的 location 会覆盖 server 级继承，那些位置要重复一份。
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 前端静态文件
    location / {
        root /srv/wuhua-tianwang/frontend;
        try_files $uri $uri/ /index.html;
        index index.html;
        # index.html 绝不能被缓存，否则发新版后用户仍加载旧 hash 的 JS
        # 基础安全响应头。带 add_header 的 location 会覆盖 server 级继承，那些位置要重复一份。
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Colyseus WebSocket 代理
    location /colyseus/ {
        proxy_pass http://127.0.0.1:2567/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端 HTTP 接口。
    #
    # proxy_pass 结尾**不能带 /** —— 带斜杠会把 /api/ 前缀吃掉，
    # /api/auth/guest 会被转成 /auth/guest，Node 那边全是 404。
    # 不带斜杠则原样透传 /api/auth/guest，与 server/src/data/api.ts
    # 里注册的路由（都以 /api 开头）对齐。
    location /api/ {
        proxy_pass http://127.0.0.1:2567;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
